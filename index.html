她把它捧进屋里，放在枕头边。云朵软软的，还有一点太阳晒过的味道。

夜里起风，云朵慢慢鼓起来，像一只打着哈欠的小动物。她把脸埋进去，听见很远很远的地方，有很轻的雨声。

后来云朵留在了枕头里，每天替她接住一点点疲惫。

晚安。`},{id:"lost-moon",title:"迷路的小月亮",text:`有一晚，小月亮从天边溜下来，在草丛里迷了路。它躲在樱花树的影子后面，只露出一点点亮。

她提着一盏小灯去找。灯很旧，光却很稳。

小月亮问，回去的路是不是很远。她说，不远，我陪你走一段。

她们沿着石头小路慢慢走，风把花瓣吹到脚边。走到小路的尽头，小月亮忽然发现自己已经飘起来了。

它回到了天上，还回头亮了很久。

晚安。`},{id:"snail-post",title:"蜗牛快递",text:`蜗牛先生是森林里最慢的快递员。他背上的小包里，总是装着很轻的信。

有人问他，这么慢，信会不会过期。

他说不会呀。想念这种东西，放久一点也不会坏。

那天他送到小屋门口一封信，信封上只有一朵小小的花。她拆开，里面是一张空白纸，纸角有一点洗过的褶皱。

她把纸贴在窗上，月光透过来，正好是一小片夜色。

晚安。`},{id:"singing-teapot",title:"会唱歌的茶壶",text:`厨房的角落里，有一只旧茶壶。白天它只是安安静静地待着，到了夜里，水烧开，它就开始唱歌。

它的歌没有词，只有咕嘟咕嘟的声音，还有一点点像风穿过窗缝。

她端着杯子坐在桌边听。热水汽在灯下慢慢升起来，把窗上的星星弄得有一点模糊。

茶壶唱完最后一句，轻轻叹了口气。她把杯子捧在手里，掌心暖了很久。

晚安。`},{id:"paper-boat",title:"纸船去旅行",text:`她折了一只小小的纸船，放在窗台上的水洼里。夜晚的雨水多得能装下一整片天。

纸船顺着水流出发，经过一块石头，又绕过一片落叶。它没有目的地，只是慢慢漂着。

她想，也许明天早上，它会停在一朵花旁边。

后来窗外的风把云吹散了，水洼里映出月亮。纸船轻轻晃了一下，安心地靠了岸。

晚安。`},{id:"fallen-star",title:"星星掉进草地",text:`有一颗星星打瞌睡，从天上掉了下来，落在草地上，砸出一个小小的光坑。

它有点不好意思，说自己本来是想去更远的地方。

她把星星放在手心，光从指缝里漏出来，照亮了脚边的一圈草。

她们在草地上坐了一会儿，没有说什么。后来星星打了个哈欠，慢慢升起来，回到了同伴中间。

草地上的那个小光坑，过了很久还暖着。

晚安。`},{id:"yawning-bear",title:"打哈欠的小熊",text:`小熊今天已经打了九十九个哈欠。每一个都比上一个更长一点。

他本来想再数一遍星星，可是数到第三颗就忘了。

她给他铺好一条小毯子。小熊钻进去，只露出两只圆圆的耳朵。

风从树梢上过去，叶子跟着晃了晃。小熊说，再等一会儿，就一会儿。

然后他睡着了。呼吸很轻，像一团慢慢散开的棉花。

晚安。`},{id:"wind-chime",title:"樱花树下的风铃",text:`樱花树下挂着一只风铃，是很多年前用一枚旧钥匙做的。

它不怎么响。只有风刚好从那个方向来的时候，才会送出一声很轻的叮。

她坐在秋千上，等了很多个傍晚。有时候等得到，有时候等不到。

有一天她发现，自己不只是在等风铃。她也在等风，等花瓣落下来，等天色慢慢变暗。

后来风来了，风铃响了一声。她笑了笑，觉得这一声刚刚好。

晚安。`},{id:"little-lighthouse",title:"小小的灯塔",text:`海边有一座很小的灯塔，小到只能照亮附近的一小片水面。

它总是担心自己不够亮。于是每天夜里，它把光调得低低的，怕打扰别人，又怕有人看不见。

有一只晚归的船路过，在它的光里停了一会儿。船上的人抬头看它，朝它挥了挥手。

灯塔忽然觉得，自己这样就很好。

那一小片亮着的光，刚好够一艘船回家。

晚安。`},{id:"warm-socks",title:"晒过太阳的袜子",text:`晾在窗边的袜子，晒了一整天的太阳。

傍晚收进来的时候，它还是暖的。她把脚伸进去，像踩进一小块下午。

袜子说，它今天看见了一只鸟，还看见云换了三次形状。

她听着，把膝盖缩进毯子里。窗外开始有虫鸣，一声一声，很轻。

屋子里慢慢安静下来。

晚安。`},{id:"window-lamp",title:"窗台上的小灯",text:`小屋的窗台上放着一盏很小的灯。白天它不亮，只是安安静静地待着，像一枚晒暖了的石头。

晚上，她把灯拧亮一点。光落在桌角、杯沿和摊开的书页上，屋子就有了一个柔软的边界。

有时候风从窗缝里进来，火苗会轻轻晃一下。她不急着去扶，只看着它自己慢慢站稳。

后来夜深了，灯还亮着。它不催她睡，也不问她今天过得怎么样。

晚安。`},{id:"waiting-postbox",title:"会等人的邮筒",text:`森林入口有一只绿色的旧邮筒。它每天只做一件事：等信。

有时候一整天都没有人来。它就听风从铁皮上走过去，听远处溪水换了一个调子。

傍晚，一个小孩跑来，把一封信塞进去。信封很轻，上面画着一颗不太圆的星星。

邮筒想，今天也算没有白等。

夜里它把信护在肚子里，慢慢睡着了。

晚安。`},{id:"moon-yarn",title:"月亮的毛线",text:`月亮有一团用旧的毛线。它太旧了，颜色被夜色洗得发白。

月亮把线头垂下来，正好落在小屋的窗边。她接住那根线，一点一点绕成一个小小的线团。

线团里藏着很多安静的东西：一片云经过的声音，一盏灯熄灭前的呼吸，还有很远的地方传来的潮声。

她把线团放在枕边。夜风经过时，毛线轻轻动了一下，像有人在很远的地方替她掖了掖被角。

晚安。`},{id:"slow-door",title:"慢慢开的门",text:`小屋有一扇很旧的门。推得太快，它会发出很大的声音；慢慢推，它就很安静。

她学会了在进门之前停一下，听门轴轻轻转过去。门后有时是暖光，有时只是一片安静的暗。

  </head>
  <body>
    <main id="app" class="app is-loading">
      <canvas id="stage" aria-label="夜晚的小木屋，屋里有床、桌子和一只小兔子" tabindex="-1"></canvas>

      <div class="scene-wash" aria-hidden="true"></div>
      <div class="scene-vignette" aria-hidden="true"></div>
      <div id="wake-glow" class="wake-glow" aria-hidden="true"></div>
      <div id="edge-glow" class="edge-glow" aria-hidden="true"></div>

      <div id="scene-hint" class="scene-hint" aria-hidden="true">
        <span class="scene-hint__dot"></span>
        <span>屋里屋外，都可以轻轻碰一碰</span>
      </div>

      <header id="hud" class="hud" aria-label="小屋顶部操作">
        <div class="hud__side">
          <button
            id="shallow-btn"
            class="icon-btn shallow-btn"
            type="button"
            aria-label="浅眠"
            aria-pressed="false"
            title="浅眠"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15.8 3.9a7.7 7.7 0 1 0 4.3 11.8A8.7 8.7 0 0 1 15.8 3.9Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
              <path d="M16.7 7.2c.35 1.2.95 1.8 2.15 2.15-1.2.35-1.8.95-2.15 2.15-.35-1.2-.95-1.8-2.15-2.15 1.2-.35 1.8-.95 2.15-2.15Z" fill="currentColor" opacity=".55"/>
            </svg>
            <span class="sr-only">浅眠</span>
          </button>
        </div>

        <div class="hud__side hud__side--right">
          <button
            id="sound-btn"
            class="icon-btn"
            type="button"
            aria-label="静音"
            aria-pressed="false"
            title="静音"
          >
            <svg class="icon-sound" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4.5 9.4h3.1l4-3.2c.7-.55 1.7-.06 1.7.83v9.94c0 .89-1 1.38-1.7.83l-4-3.2H4.5a1 1 0 0 1-1-1v-3.2a1 1 0 0 1 1-1Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
              <path d="M16.2 9.1a4.4 4.4 0 0 1 0 5.8M18.7 6.9a7.6 7.6 0 0 1 0 10.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <svg class="icon-muted" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4.5 9.4h3.1l4-3.2c.7-.55 1.7-.06 1.7.83v9.94c0 .89-1 1.38-1.7.83l-4-3.2H4.5a1 1 0 0 1-1-1v-3.2a1 1 0 0 1 1-1Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
              <path d="m16.1 9.8 4.4 4.4M20.5 9.8l-4.4 4.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span class="sr-only">静音</span>
          </button>

          <button
            id="settings-btn"
            class="icon-btn"
            type="button"
            aria-label="设置"
            title="设置"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M10.2 3.6c.14-.8.84-1.36 1.65-1.36h.3c.8 0 1.5.56 1.65 1.36l.21 1.2c.45.2.87.47 1.25.8l1.17-.37c.76-.24 1.58.15 1.9.86l.14.3c.33.7.13 1.54-.5 2l-.97.72c.03.25.05.5.05.75s-.02.5-.05.75l.97.72c.63.46.83 1.3.5 2l-.14.3c-.32.71-1.14 1.1-1.9.86l-1.17-.37c-.38.33-.8.6-1.25.8l-.21 1.2c-.14.8-.84 1.36-1.65 1.36h-.3c-.8 0-1.5-.56-1.65-1.36l-.21-1.2a7.8 7.8 0 0 1-1.25-.8l-1.17.37c-.76.24-1.58-.15-1.9-.86l-.14-.3c-.33-.7-.13-1.54.5-2l.97-.72A6.5 6.5 0 0 1 5.9 10c0-.25.02-.5.05-.75l-.97-.72c-.63-.46-.83-1.3-.5-2l.14-.3c.32-.71 1.14-1.1 1.9-.86l1.17.37c.38-.33.8-.6 1.25-.8l.21-1.2Z" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/>
              <circle cx="12" cy="10.2" r="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            <span class="sr-only">设置</span>
          </button>

          <button
            id="exit-btn"
            class="icon-btn exit-btn"
            type="button"
            aria-label="离开小屋"
            title="离开小屋"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 20V5.6c0-.5.36-.93.86-1.02l8-1.45c.6-.1 1.14.35 1.14.96V20" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linejoin="round"/>
              <path d="M3.5 20.2h17" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round"/>
              <circle cx="12.4" cy="12.2" r=".8" fill="currentColor"/>
              <path d="M16.2 10.3a2.1 2.1 0 1 1 2 3.2 2.6 2.6 0 0 1-2-1" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity=".65"/>
            </svg>
            <span class="sr-only">离开小屋</span>
          </button>
        </div>
      </header>

      <nav id="season-switch" class="season-switch" aria-label="切换季节">
        <span class="season-switch__label">四季</span>
        <button type="button" data-season="spring" aria-label="春天">春<small>1</small></button>
        <button type="button" data-season="summer" aria-label="夏天">夏<small>2</small></button>
        <button type="button" data-season="autumn" aria-label="秋天">秋<small>3</small></button>
        <button type="button" data-season="winter" aria-label="冬天">冬<small>4</small></button>
      </nav>

      <section id="shallow-layer" class="shallow-layer" aria-hidden="true">
        <div class="shallow-layer__veil"></div>
        <div class="shallow-core">
          <div id="breath-orb" class="breath-orb" aria-hidden="true"></div>
          <p class="shallow-copy">跟着光点慢慢呼吸，不跟着也行。</p>
          <div class="shallow-actions">
            <button id="breath-toggle" class="shallow-mini" type="button">隐藏光点</button>
            <button id="shallow-sound" class="shallow-mini" type="button">选个声音</button>
          </div>
          <label class="shallow-volume">
            <span>音量</span>
            <input id="shallow-volume" type="range" min="0" max="100" step="1" value="30" />
            <b id="shallow-volume-value">30%</b>
          </label>
        </div>
      </section>
      <button id="shallow-exit" class="shallow-exit" type="button">退出浅眠</button>

      <div id="hotspots" class="hotspots" aria-live="polite"></div>

      <div id="joystick" class="joystick" aria-label="移动摇杆">
        <div class="joystick__ring">
          <span class="joystick__knob" id="joystick-knob"></span>
        </div>
        <span class="joystick__label">走一走</span>
      </div>

      <button id="activity-exit" class="activity-exit" type="button">结束</button>
      <button id="meteor-btn" class="meteor-btn" type="button" aria-label="召唤一颗流星">
        <span aria-hidden="true">✦</span> 看流星
      </button>
      <button id="context-action" class="context-action" type="button">
        <span id="context-action-text">看看</span>
        <kbd>E</kbd>
      </button>

      <div id="toast" class="toast" role="status" aria-live="polite">
        <span id="toast-text"></span>
      </div>

      <div id="star-whisper" class="star-whisper" aria-hidden="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8c.8 4.7 3.7 7.6 8.4 8.4-4.7.8-7.6 3.7-8.4 8.4-.8-4.7-3.7-7.6-8.4-8.4 4.7-.8 7.6-3.7 8.4-8.4Z" fill="currentColor"/></svg>
        <span id="star-whisper-text">有流星，抬头看看</span>
      </div>

      <div id="drawer-scrim" class="drawer-scrim" aria-hidden="true"></div>
      <aside
        id="drawer"
        class="drawer"
        role="dialog"
        aria-modal="true"
        aria-labelledby="drawer-title"
        aria-hidden="true"
      >
        <div class="drawer__grip" aria-hidden="true"><span></span></div>
        <div class="drawer__head">
          <div class="drawer__titles">
            <p id="drawer-eyebrow" class="drawer__eyebrow">小屋</p>
            <h2 id="drawer-title" class="drawer__title">坐一会儿</h2>
          </div>
          <button id="drawer-close" class="drawer__close" type="button" aria-label="收起面板">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div id="drawer-body" class="drawer__body"></div>
        <div id="drawer-foot" class="drawer__foot"></div>
      </aside>

      <section id="splash" class="overlay splash" aria-label="小屋入口">
        <div class="overlay__sky" aria-hidden="true">
          <div id="splash-stars" class="splash-stars"></div>
          <div class="splash-moon"></div>
          <div class="splash-haze"></div>
        </div>
        <div class="silhouette silhouette--splash" aria-hidden="true">
          <svg viewBox="0 0 1200 540" preserveAspectRatio="xMidYMax slice">
            <defs>
              <linearGradient id="hillA" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#1a2c47" /><stop offset="1" stop-color="#101c31" />
              </linearGradient>
              <filter id="windowGlow" x="-200%" y="-200%" width="400%" height="400%">
                <feGaussianBlur stdDeviation="18" result="blur" />
                <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
              </filter>
              <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
                <feGaussianBlur stdDeviation="7" />
              </filter>
            </defs>
            <path d="M0 388c122-42 206-35 318-3 125 36 205 12 310-20 114-35 214-39 322 2 86 33 167 22 250-4v177H0Z" fill="url(#hillA)" />
            <g fill="#0c1728">
              <path d="M90 386v-69l25-19 26 19v69Z" />
              <path d="M67 317 115 281l49 36Z" />
              <circle cx="115" cy="297" r="31" opacity=".55" />
            </g>
            <g transform="translate(392 214)">
              <path d="M0 174h308v-81L154 0 0 93Z" fill="#0a1322" />
              <path d="M-22 102 154-23l176 125-20 17L154-1 0 118Z" fill="#152337" />
              <path d="M14 93h280v81H14Z" fill="#0c1728" />
              <path d="M44 112h220v62H44Z" fill="#111e31" />
              <path d="M46 125h56v36H46Z" fill="#ffbe73" filter="url(#windowGlow)" />
              <path d="M47 126h54v34H47Z" fill="#ffc987" />
              <path d="M73 126v34M47 143h54" stroke="#8f562b" stroke-width="2" opacity=".65" />
              <path d="M232 112h30v62h-30Z" fill="#0a1321" />
              <circle cx="243" cy="145" r="1.8" fill="#f2c887" />
              <path d="M170 85V44h18v41" fill="#101d30" />
              <path d="M148 38c9-15 30-19 43-7 13-8 32-2 35 12-8 9-20 12-32 6-12 8-32 5-46-11Z" fill="#1b2a3f" opacity=".9" />
              <path d="M-9 177h326" stroke="#1b2b42" stroke-width="5" stroke-linecap="round" />
            </g>
            <g transform="translate(825 238)">
              <path d="M50 155c9-37 2-82 8-119 3-15 17-24 25-17 8 8 5 27-4 37-7 7-11 23-6 49 1 6 8 26 7 50Z" fill="#0a1322" />
              <path d="M68 77C45 58 26 56 3 58M72 68c22-15 41-23 62-20M67 100c-19 12-31 22-43 39M72 102c18-4 33-2 49 8M67 52C57 35 46 27 34 17" fill="none" stroke="#0a1322" stroke-width="9" stroke-linecap="round" />
              <g fill="#3d2b3d" opacity=".93">
                <circle cx="7" cy="47" r="32" /><circle cx="41" cy="22" r="43" /><circle cx="84" cy="12" r="33" /><circle cx="122" cy="26" r="45" /><circle cx="150" cy="48" r="29" />
                <circle cx="28" cy="68" r="26" /><circle cx="103" cy="58" r="37" /><circle cx="143" cy="85" r="24" /><circle cx="62" cy="48" r="28" />

          </svg>
        </div>

        <div class="splash__content">
          <p class="splash__eyebrow">一间留给你的小屋</p>
          <h1 class="splash__title">在这里，<br />你就是你自己。</h1>
          <p class="splash__sub">慢慢来，随便坐坐。</p>
          <button id="enter-btn" class="wood-button" type="button">
            <span class="wood-button__grain" aria-hidden="true"></span>
            <span class="wood-button__label">进来坐坐</span>
            <span class="wood-button__arrow" aria-hidden="true">→</span>
          </button>
          <p class="splash__foot">不用准备什么，门开着。</p>
        </div>
      </section>

      <section id="farewell" class="overlay farewell" aria-label="离开小屋" aria-hidden="true">
        <div class="overlay__sky" aria-hidden="true">
          <div id="farewell-stars" class="splash-stars"></div>
          <div class="splash-moon splash-moon--farewell"></div>
          <div class="splash-haze"></div>
        </div>
        <div class="silhouette silhouette--farewell" aria-hidden="true">
          <svg viewBox="0 0 1200 540" preserveAspectRatio="xMidYMax slice">
            <defs>
              <linearGradient id="hillB" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#16253d" /><stop offset="1" stop-color="#0b1425" />
              </linearGradient>
              <filter id="farewellLamp" x="-300%" y="-300%" width="700%" height="700%">
                <feGaussianBlur stdDeviation="16" result="blur" />

              </filter>

            <path d="M0 410c140-37 242-29 347 0 105 28 201 10 294-16 131-37 234-30 345 5 77 24 147 16 214-4v145H0Z" fill="url(#hillB)" />

              <path d="M223 109h24v53h-24Z" fill="#0b1421" />
              <circle cx="235" cy="135" r="1.6" fill="#f2cd91" />
              <path d="M306 98h-14v-30h14Z" fill="#141f31" />
              <path d="M280 64c9-12 24-14 35-4 9-7 23-3 27 8-8 7-18 9-28 5-10 5-23 3-34-9Z" fill="#1d2b3f" />
            </g>
            <g transform="translate(845 278)" opacity=".9">
              <path d="M45 120c8-36 2-72 5-105 2-13 15-20 22-13 7 7 4 22-4 31-6 7-8 19-4 43 1 6 7 23 6 44Z" fill="#0b1421" />
              <path d="M63 52C42 35 27 33 7 36M66 47c18-14 34-19 52-16M61 78c-15 10-25 18-35 32M66 80c16-4 29-1 43 7" fill="none" stroke="#0b1421" stroke-width="8" stroke-linecap="round" />
              <circle cx="14" cy="24" r="30" fill="#332738" opacity=".9" /><circle cx="55" cy="9" r="37" fill="#332738" opacity=".9" /><circle cx="104" cy="18" r="31" fill="#332738" opacity=".9" /><circle cx="126" cy="43" r="24" fill="#332738" opacity=".9" /><circle cx="35" cy="45" r="26" fill="#332738" opacity=".9" />
            </g>
            <path d="M0 505c164-12 298-2 426 8 160 12 251-17 394-12 152 5 247 16 380-8v47H0Z" fill="#07111e" />
          </svg>
        </div>
        <div class="farewell__content">
          <div class="farewell__lamp" aria-hidden="true">
            <span class="farewell__lamp-glow"></span>
            <span class="farewell__lamp-shade"></span>
            <span class="farewell__lamp-stem"></span>
            <span class="farewell__lamp-base"></span>
          </div>
          <p class="farewell__eyebrow">小屋的灯还亮着</p>
          <h2 class="farewell__title">门没锁，<br />灯给你留着。</h2>
          <p class="farewell__sub">随时都能回来看看。</p>
          <p class="farewell__soft">这里一直都在。</p>
          <div class="farewell__actions">
            <button id="stay-btn" class="wood-button wood-button--quiet" type="button">
              <span class="wood-button__label">再坐一会儿</span>
            </button>
            <button id="leave-btn" class="text-button" type="button">先走啦</button>
          </div>
        </div>
      </section>

      <div id="boot-veil" class="boot-veil" aria-hidden="true"></div>
    </main>

  </body>
</html>
